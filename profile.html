
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Profile — Tioflos NFC</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9922A; --gold-light: #F0C060;
      --navy: #0A1628; --white: #FFFFFF;
      --off-white: #F9F7F3; --mid: #6B7280; --border: #E5E7EB;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'DM Sans',sans-serif; background:#F0F2F5; min-height:100vh; }
    h1,h2,h3 { font-family:'Syne',sans-serif; }

    .profile-page { max-width:480px; margin:0 auto; min-height:100vh; background:var(--white); box-shadow:0 0 40px rgba(0,0,0,0.1); }

    /* COVER */
    .cover-area { position:relative; height:160px; overflow:visible; }
    .cover-bg { width:100%; height:160px; object-fit:cover; display:block; }
    .cover-color { width:100%; height:160px; display:block; }

    /* PROFILE + LOGO overlap */
    .overlap-row {
      position:absolute; bottom:-45px; left:0; right:0;
      display:flex; justify-content:space-between; align-items:flex-end;
      padding:0 1.25rem;
    }
    .profile-avatar {
      width:90px; height:90px; border-radius:50%;
      border:4px solid var(--white); overflow:hidden;
      background:var(--gold); display:flex; align-items:center;
      justify-content:center; font-family:'Syne',sans-serif;
      font-weight:800; font-size:2rem; color:var(--white);
      flex-shrink:0; box-shadow:0 4px 16px rgba(0,0,0,0.15);
    }
    .profile-avatar img { width:100%; height:100%; object-fit:cover; }
    .logo-box {
      width:110px; height:72px; border-radius:12px;
      border:3px solid var(--white); overflow:hidden;
      background:var(--white); display:flex; align-items:center;
      justify-content:center; box-shadow:0 4px 16px rgba(0,0,0,0.15);
      flex-shrink:0;
    }
    .logo-box img { width:100%; height:100%; object-fit:contain; padding:6px; }
    .logo-box-placeholder {
      font-family:'Syne',sans-serif; font-weight:800;
      font-size:0.75rem; color:var(--mid); text-align:center; padding:0.5rem;
    }

    /* INFO */
    .profile-info { padding:3.5rem 1.25rem 1rem; }
    .profile-name { font-size:1.6rem; font-weight:800; color:#111827; margin-bottom:0.2rem; }
    .profile-type { font-size:0.9rem; color:var(--mid); margin-bottom:0.15rem; }
    .profile-tagline { font-size:0.82rem; color:#9CA3AF; font-style:italic; }

    /* CONTACT ROWS */
    .contact-section { padding:0.75rem 1.25rem; }
    .contact-row {
      display:flex; align-items:center; gap:0.85rem;
      padding:0.6rem 0; border-bottom:1px solid var(--border);
    }
    .contact-row:last-child { border-bottom:none; }
    .contact-icon {
      width:36px; height:36px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:1rem; flex-shrink:0;
    }
    .contact-text { font-size:0.875rem; color:#374151; font-weight:500; }
    .contact-text a { color:#374151; text-decoration:none; }
    .contact-text a:hover { color:var(--gold); }

    /* PLATFORMS */
    .platforms-section { padding:1rem 1.25rem; }
    .platforms-title {
      font-size:0.7rem; font-weight:700; color:var(--mid);
      text-transform:uppercase; letter-spacing:1.5px; margin-bottom:0.75rem;
    }
    .platforms-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:0.6rem; }
    .platform-btn {
      display:flex; flex-direction:column; align-items:center; gap:0.3rem;
      padding:0.75rem 0.3rem; background:var(--off-white);
      border-radius:12px; border:1px solid var(--border);
      text-decoration:none; transition:transform 0.15s, box-shadow 0.15s;
    }
    .platform-btn:hover { transform:translateY(-2px); box-shadow:0 4px 16px rgba(0,0,0,0.1); }
    .platform-btn:active { transform:scale(0.95); }
    .pb-icon { font-size:1.4rem; }
    .pb-label { font-size:0.55rem; font-weight:600; color:var(--mid); text-align:center; }

    /* CTA */
    .cta-section { padding:1rem 1.25rem 0.5rem; }
    .cta-btn {
      display:block; width:100%; padding:1rem;
      background:var(--gold); color:var(--navy);
      border-radius:14px; font-family:'Syne',sans-serif;
      font-weight:800; font-size:1rem; text-align:center;
      text-decoration:none; transition:background 0.2s;
      box-shadow:0 4px 20px rgba(201,146,42,0.3);
    }
    .cta-btn:hover { background:var(--gold-light); }

    /* POWERED BY */
    .powered-by {
      text-align:center; padding:1.25rem;
      font-size:0.72rem; color:#9CA3AF;
      border-top:1px solid var(--border); margin-top:1rem;
    }
    .powered-by a { color:var(--gold); font-weight:700; text-decoration:none; }
    
    /* ── VCARD BUTTON ── */
    .vcard-btn-container {
      padding: 0.25rem 1.25rem;
    }
    .vcard-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.9rem;
      background: var(--navy);
      color: var(--white);
      border-radius: 14px;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      text-align: center;
      text-decoration: none;
      border: 1.5px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 24px rgba(10,22,40,0.08);
      cursor: pointer;
      transition: all 0.2s;
    }
    .vcard-btn:hover {
      background: #1A2744;
      transform: translateY(-1px);
    }
    .vcard-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
<div class="profile-page" id="profile-page">
  <div style="text-align:center;padding:4rem 2rem;">
    <div style="font-size:2rem;margin-bottom:1rem;">⏳</div>
    <p style="color:var(--mid);">Loading profile...</p>
  </div>
</div>

<script>
const PLATFORMS = {
  whatsapp:    { icon:'💬', label:'WhatsApp',    base:'https://wa.me/' },
  telegram:    { icon:'✈️', label:'Telegram',    base:'https://t.me/' },
  facebook:    { icon:'📘', label:'Facebook',    base:'' },
  instagram:   { icon:'📸', label:'Instagram',   base:'https://instagram.com/' },
  tiktok:      { icon:'🎵', label:'TikTok',      base:'https://tiktok.com/@' },
  youtube:     { icon:'▶️', label:'YouTube',     base:'' },
  twitter:     { icon:'🐦', label:'Twitter/X',   base:'https://x.com/' },
  snapchat:    { icon:'👻', label:'Snapchat',    base:'https://snapchat.com/add/' },
  linkedin:    { icon:'💼', label:'LinkedIn',    base:'' },
  maps:        { icon:'📍', label:'Maps',        base:'' },
  website:     { icon:'🌐', label:'Website',     base:'' },
  tripadvisor: { icon:'⭐', label:'TripAdvisor', base:'' },
};

const ICON_COLORS = {
  whatsapp:'#25D366', telegram:'#2AABEE', facebook:'#1877F2',
  instagram:'#E1306C', tiktok:'#000000', youtube:'#FF0000',
  twitter:'#1DA1F2', snapchat:'#FFFC00', linkedin:'#0A66C2',
  maps:'#EA4335', website:'#6B7280', tripadvisor:'#34E0A1',
};

function p(params, key) { return params.get(key) || ''; }

function buildProfile() {
  const params = new URLSearchParams(window.location.search);
  const name     = p(params,'name');
  const type     = p(params,'type');
  const tagline  = p(params,'tagline');
  const color    = p(params,'color') || '#0A1628';
  const phone    = p(params,'phone');
  const phone2   = p(params,'phone2');
  const phone3   = p(params,'phone3');
  const hours    = p(params,'hours');
  
  let cover    = p(params,'cover');
  let avatar   = p(params,'avatar');
  let logo     = p(params,'logo');

  if (!name) {
    document.getElementById('profile-page').innerHTML = `
      <div style="text-align:center;padding:4rem 2rem;">
        <div style="font-size:2.5rem;margin-bottom:1rem;">❌</div>
        <h2 style="font-family:'Syne',sans-serif;color:#111827;margin-bottom:0.5rem;">Profile not found</h2>
        <p style="color:var(--mid);">This NFC card profile doesn't exist or the link is broken.</p>
      </div>`;
    return;
  }

  // Local testing fallback: check localStorage for missing cover/avatar/logo
  try {
    if (!cover || !avatar || !logo) {
      const localOrders = JSON.parse(localStorage.getItem('tioflos_orders') || '[]');
      const matchingOrder = localOrders.find(o => (o.biz || '').trim() === name.trim());
      if (matchingOrder) {
        if (!cover && matchingOrder.coverPhoto) cover = matchingOrder.coverPhoto;
        if (!avatar && matchingOrder.avatarPhoto) avatar = matchingOrder.avatarPhoto;
        if (!logo && matchingOrder.logoPhoto) logo = matchingOrder.logoPhoto;
      }
    }
  } catch (e) {
    console.warn('Could not read localStorage fallback:', e);
  }

  document.title = name + ' — NFC Profile';

  // Cover
  const coverHtml = cover
    ? `<img class="cover-bg" src="${cover}" alt="Cover">`
    : `<div class="cover-color" style="background:${color}"></div>`;

  // Avatar
  const avatarHtml = avatar
    ? `<img src="${avatar}" alt="${name}">`
    : `<span>${name[0].toUpperCase()}</span>`;

  // Logo
  const logoHtml = logo
    ? `<img src="${logo}" alt="Logo">`
    : `<div class="logo-box-placeholder">LOGO</div>`;

  // Platforms
  const activePlatforms = [];
  Object.keys(PLATFORMS).forEach(key => {
    const val = p(params, key);
    if (val) {
      const pl = PLATFORMS[key];
      const href = val.startsWith('http') ? val : pl.base + val;
      activePlatforms.push({ key, icon:pl.icon, label:pl.label, href });
    }
  });

  const platformBtns = activePlatforms.map(pl => `
    <a class="platform-btn" href="${pl.href}" target="_blank" rel="noopener">
      <span class="pb-icon">${pl.icon}</span>
      <span class="pb-label">${pl.label}</span>
    </a>
  `).join('');

  // Contact rows
  const phones = [phone, phone2, phone3].filter(Boolean);
  const phoneRows = phones.map(ph => `
    <div class="contact-row">
      <div class="contact-icon" style="background:#EEF2FF;">📞</div>
      <div class="contact-text"><a href="tel:${ph}">${ph}</a></div>
    </div>`).join('');

  const hoursRow = hours ? `
    <div class="contact-row">
      <div class="contact-icon" style="background:#FEF3C7;">🕐</div>
      <div class="contact-text">${hours}</div>
    </div>` : '';

  const locationRow = `
    <div class="contact-row">
      <div class="contact-icon" style="background:#FEE2E2;">📍</div>
      <div class="contact-text">Arba Minch, Ethiopia</div>
    </div>`;

  // CTA button
  const waVal = p(params,'whatsapp');
  const waNum = waVal.replace(/\D/g,'');
  const ctaBtn = waNum
    ? `<a class="cta-btn" href="https://wa.me/${waNum}" target="_blank">💬 Chat on WhatsApp</a>`
    : phone
    ? `<a class="cta-btn" href="tel:${phone}">📞 Call Now</a>`
    : '';

  // vCard save contact button HTML
  const vcardBtnHtml = `
    <div class="vcard-btn-container" style="margin-top: 0.5rem;">
      <button class="vcard-btn" onclick="downloadVCard()">👤 Save Contact</button>
    </div>
  `;

  document.getElementById('profile-page').innerHTML = `
    <!-- COVER + OVERLAP -->
    <div class="cover-area">
      ${coverHtml}
      <div class="overlap-row">
        <div class="profile-avatar">${avatarHtml}</div>
        <div class="logo-box">${logoHtml}</div>
      </div>
    </div>

    <!-- INFO -->
    <div class="profile-info">
      <div class="profile-name">${name}</div>
      ${type ? `<div class="profile-type">${type}</div>` : ''}
      ${tagline ? `<div class="profile-tagline">${tagline}</div>` : ''}
    </div>

    <!-- CONTACT -->
    <div class="contact-section">
      ${phoneRows}
      ${hoursRow}
      ${locationRow}
    </div>

    <!-- PLATFORMS -->
    ${activePlatforms.length > 0 ? `
    <div class="platforms-section">
      <div class="platforms-title">Connect with us</div>
      <div class="platforms-grid">${platformBtns}</div>
    </div>` : ''}

    <!-- CTA -->
    ${ctaBtn ? `<div class="cta-section">${ctaBtn}</div>` : ''}

    <!-- SAVE CONTACT VCARD -->
    ${vcardBtnHtml}

    <!-- POWERED BY -->
    <div class="powered-by">
      Powered by <a href="https://tioflosnfc.github.io" target="_blank">Tioflos NFC</a> · Arba Minch, Ethiopia
    </div>
  `;
}

window.downloadVCard = function() {
  const params = new URLSearchParams(window.location.search);
  const name     = p(params,'name');
  const type     = p(params,'type');
  const tagline  = p(params,'tagline');
  const phone    = p(params,'phone');
  const phone2   = p(params,'phone2');
  const phone3   = p(params,'phone3');
  
  if (!name) return;
  
  const cleanName = name.replace(/[^\w\s-]/g, '').trim();
  const cleanPhone = phone ? phone.replace(/[^\d+]/g, '') : '';
  const cleanPhone2 = phone2 ? phone2.replace(/[^\d+]/g, '') : '';
  const cleanPhone3 = phone3 ? phone3.replace(/[^\d+]/g, '') : '';

  let vcard = 'BEGIN:VCARD\n';
  vcard += 'VERSION:3.0\n';
  vcard += `N:;${name};;;\n`;
  vcard += `FN:${name}\n`;
  if (type) vcard += `ORG:${type}\n`;
  if (tagline) vcard += `NOTE:${tagline}\n`;
  
  if (cleanPhone) vcard += `TEL;TYPE=CELL,VOICE;VALUE=uri:tel:${cleanPhone}\n`;
  if (cleanPhone2) vcard += `TEL;TYPE=CELL,VOICE;VALUE=uri:tel:${cleanPhone2}\n`;
  if (cleanPhone3) vcard += `TEL;TYPE=CELL,VOICE;VALUE=uri:tel:${cleanPhone3}\n`;
  
  const websiteVal = p(params, 'website');
  if (websiteVal) {
    vcard += `URL;type=pref:${websiteVal.startsWith('http') ? websiteVal : 'http://' + websiteVal}\n`;
  }
  
  const mapsVal = p(params, 'maps');
  if (mapsVal) {
    vcard += `URL;type=work:${mapsVal.startsWith('http') ? mapsVal : 'http://' + mapsVal}\n`;
  }

  vcard += 'END:VCARD';

  const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `${cleanName || 'Contact'}.vcf`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
};


buildProfile();
</script>
</body>
</html>
